version: '3.8'

services:
  subscraper:
    build:
      context: .
      dockerfile: Dockerfile
    image: subscraper:latest
    container_name: subscraper
    ports:
      - "8342:8342"
    volumes:
      # Required: persists SQLite DB, screenshots, backups, scan history, config
      - ./recon_data:/app/recon_data
      # Optional: mount custom wordlists for ffuf brute-forcing
      # - ./wordlists:/app/wordlists
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONIOENCODING=utf-8
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8342/login"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

# ── Usage ──────────────────────────────────────────────────
#
#  Build & start:
#    docker-compose up -d --build
#
#  View logs:
#    docker-compose logs -f
#
#  Stop:
#    docker-compose down
#
#  Backup data:
#    docker-compose down && tar -czf backup.tar.gz recon_data/
#
#  Restore:
#    tar -xzf backup.tar.gz && docker-compose up -d
#
# ── First run ──────────────────────────────────────────────
#
#  Create the admin account after the first start:
#
#    docker exec -it subscraper python3 -c "
#    import main; main.ensure_dirs(); main.ensure_database()
#    ok, msg = main.create_user('admin', 'changeme', is_admin=True)
#    print(ok, msg)"
#
#  Then open http://localhost:8342 and log in with admin / changeme
#
# ──────────────────────────────────────────────────────────
